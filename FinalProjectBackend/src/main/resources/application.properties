spring.application.name=FinalProject
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/AUCASA
spring.datasource.username=postgres
spring.datasource.password=desire123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Mobile money integration
# Set to false for real provider push. When true, no real phone prompt is sent.
app.payment.mobile-money.simulate=false
app.payment.mobile-money.provider-url=
app.payment.mobile-money.api-key=
app.payment.mobile-money.callback-url=http://localhost:8082/api/payments/mobile-money/callback

# File storage
app.storage.labour-upload-dir=${user.home}/FinalProjectStudentHubUploads/labour

# Attendance network validation
# Comma-separated CIDR ranges for campus Wi-Fi networks. Example: 10.10.0.0/16,192.168.10.0/24
app.attendance.allowed-cidrs=
app.attendance.enforce-network=true

# Election uploads
app.storage.election-upload-dir=${user.home}/FinalProjectStudentHubUploads/elections
